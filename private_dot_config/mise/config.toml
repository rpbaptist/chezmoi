[settings]
disable_tools = ['redis', 'postgres']
experimental = true
minimum_release_age = "12h"
[tools]
elixir = "latest"
erlang = "latest"
usage = "latest"
go = "latest"
"cargo:eza" = "latest"
"cargo:bat" = "latest"
"cargo:ripgrep" = "latest"
lua = "5.1"
python = "latest"
ruby = "latest"
cursor-cli = { version = "latest", bin_path = "dist-package", strip_components = 0, url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch(x64="x64", arm64="arm64") }}/agent-cli-package.tar.gz', version_list_url = "https://cursor.com/install", version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/' }
herdr = "latest"
bun = "latest"
gemini = { version = "latest", allow_builds = ["@github/keytar", "node-pty"] }
