format = """
([ $username$hostname ](bg:background)\
[ ](fg:black bg:background))\
\
[ $directory ](bg:background)\
[([ ](fg:black bg:background)\
$elixir\
$python\
$ruby\
$golang\
$custom\
$c\
$nodejs )](bg:background)\
\
[([ ](fg:black bg:background)\
$git_branch\
$git_commit\
$git_state\
$git_status )](fg:bright-cyan bg:background)\
\
[](background)\
$line_break\
($sudo )$character
"""

command_timeout = 600

palette = "dark"

[palettes.dark]
background = "#3c3836"

[palettes.light]
background = "#ebdbb2"

continuation_prompt = ''

[sudo]
disabled = true
style = 'bright-purple'
symbol = ''
format = '[$symbol]($style)'

[character]
success_symbol = "[❯](blue)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[directory]
read_only = " 󰌾"
read_only_style = "fg:bright-red bg:background"
style = "fg:yellow bg:background"
format = '[$path]($style)[$read_only]($read_only_style)'

[git_branch]
symbol = "󰘬 "
truncation_length = 40
style = "fg:bright-cyan bg:background"
format = "[$symbol$branch]($style)"

[git_commit]
tag_symbol = " 󰓹 "
style = "fg:bright-cyan bg:background"
format = '[\($hash$tag\)]($style)'

[git_status]
stashed = "≡"
ahead = '[](fg:cyan bg:background)'
up_to_date = "[✔](bold fg:cyan bg:background)"
behind = '[](fg:bright-red bg:background)'
diverged = "[✗](fg:bold bright-red bg:background)"
staged = '[+](fg:bold cyan bg:background)'
deleted = '[-](fg:bold bright-red bg:background)'
untracked = '[?](fg:bright-yellow bg:background)'
renamed = '[»](fg:bright-yellow bg:background)'
modified = "[≠](fg:bright-yellow bg:background)"
typechanged = ''
style = 'bg:background'
format = "[( $ahead_behind)( $all_status)]($style)"

[git_state]
style = "fg:bright-yellow bg:background"
format = ' [$state( $progress_current/$progress_total)]($style)'

[cmd_duration]
disabled = true
format = "[$duration]($style) "
style = "yellow"

[username]
style_user = "fg:bright-blue bg:background"
style_root = "fg:bold red bg:background"
format = "[$user]($style)"
# show_always = true

[hostname]
# ssh_only = false
style = "fg:bright-yellow bg:background"
ssh_symbol = " "
format = "[@$hostname]($style)"

[aws]
symbol = "  "

[c]
symbol = " "
style = 'fg:bright-yellow bg:background'
version_format = '${raw}'
format = '[$symbol($version(-$name))]($style)'

[docker_context]
symbol = " "
format = '[$symbol($version(-$name))]($style)'

[elixir]
disabled = true
symbol = " "
version_format = '${raw}'
style = 'fg:bright-purple bg:background'
format = '[$symbol$version]($style)'

[custom.elixir]
symbol = " "
style = 'fg:bright-purple bg:background'
command = "elixir --short-version"
format = '[$symbol$output]($style)'
detect_files = ['mix.exs']

[golang]
symbol = "󰟓 "
style = 'fg:bright-blue bg:background'
format = '[$symbol($version(-$name))]($style)'

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nix_shell]
symbol = " "

[zig]
symbol = " "
style = 'fg:bright-purple bg:background'
format = '[$symbol$version]($style)'

[nodejs]
symbol = " "
style = "fg:green bg:background"
version_format = '${raw}'
format = '[$symbol($version)]($style)'

[os.symbols]
Alpine = " "
Arch = " "
Artix = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Linux = " "
Mabox = " "
Manjaro = " "
NixOS = " "
OpenBSD = "󰈺 "
openSUSE = " "
Raspbian = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "

[package]
symbol = "󰏗 "

[python]
symbol = " "
style = 'fg:bright-yellow bg:background'
format = '[$symbol$version]($style)'

[ruby]
symbol = " "
style = 'fg:bright-red bg:background'
format = '[$symbol($version)]($style)'

[rust]
symbol = " "
