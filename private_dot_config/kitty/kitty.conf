# vim:fileencoding=utf-8:ft=conf:foldmethod=marker
# Full option reference: https://sw.kovidgoyal.net/kitty/conf/

include ~/.local/state/omarchy/current/theme/kitty.conf

shell /usr/bin/zsh

# Font
modify_font cell_width 105%
modify_font baseline 1
font_size 9.8
disable_ligatures cursor

# Cursor
cursor_shape beam
cursor_beam_thickness 1
cursor_blink_interval 0.6
cursor_trail 200
cursor_trail_start_threshold 1

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 4096

# Mouse
touch_scroll_multiplier 6
url_style single
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
copy_on_select yes

# Window
map f11 toggle_fullscreen
enable_audio_bell no
window_alert_on_bell no
bell_on_tab no
enabled_layouts splits
window_border_width 2px
draw_minimal_borders no
window_margin_width 0
window_padding_width 5
inactive_text_alpha 0.85
hide_window_decorations yes

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
active_tab_font_style bold
inactive_tab_font_style normal

linux_display_server wayland

background_opacity 0.98

# Keyboard shortcuts
kitty_mod ctrl+shift
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map kitty_mod+up        no_op
map kitty_mod+down      no_op
map ctrl+page_up scroll_page_up
map ctrl+page_down scroll_page_down
map ctrl+home scroll_home
map ctrl+end scroll_end
map kitty_mod+n>i  launch --cwd=current --location=vsplit
map kitty_mod+n>e  launch --cwd=current --location=hsplit
map kitty_mod+n>w    new_os_window_with_cwd
map kitty_mod+right no_op
map kitty_mod+left no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
map ctrl+alt+tab no_op
map ctrl+alt+shift+tab no_op
# map kitty_mod+t new_tab_with_cwd
map kitty_mod+backspace change_font_size all 0
map kitty_mod+f>kitty_mod+f kitten hints --type regex --regex "(?ms)(\S+[.]\w+\W)" --hints-foreground-color black --hints-background-color gray --hints-text-color yellow --program -
map kitty_mod+f>kitty_mod+c kitten hints --type regex --regex "(?ms)(\S+[.]\w+\W)" --hints-foreground-color black --hints-background-color gray --hints-text-color yellow --program @
map ctrl+m>ctrl+m toggle_marker regex 1 "^❯\s{1}.+$"
map ctrl+m>ctrl+p scroll_to_mark prev
map ctrl+m>ctrl+n scroll_to_mark next

# Nerd Font symbol ranges
symbol_map U+23FB-U+23FE,U+2B58 Symbols Nerd Font Mono
symbol_map U+2665,U+26A1,U+F400-U+F533 Symbols Nerd Font Mono
symbol_map U+E000-U+E00A Symbols Nerd Font Mono
symbol_map U+E0A0-U+E0A2,U+E0A3,U+E0B0-U+E0B3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D7 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9,U+ED00-U+EFC1,U+F000-U+F2FF Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+E5FA-U+E6B5 Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5 Symbols Nerd Font Mono
symbol_map U+EA60-U+EC1E Symbols Nerd Font Mono
symbol_map U+F300-U+F3726 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Force Noto Color Emoji; Font Awesome/DejaVu also claim these codepoints,
# causing wrong/monochrome fallbacks. Excludes BMP ranges already claimed
# above for Nerd Font prompt icons.
symbol_map U+1F000-U+1F2FF,U+1F300-U+1FAFF,U+FE0F Noto Color Emoji
