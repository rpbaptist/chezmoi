# vim:fileencoding=utf-8:ft=conf:foldmethod=marker
# Full option reference: https://sw.kovidgoyal.net/kitty/conf/

include ~/.local/state/omarchy/current/theme/kitty.conf

shell /usr/bin/zsh

# Font
font_family family="JetBrains Mono" style="ExtraLight" features="cv07=1 cv08=1"
modify_font cell_width 105%
modify_font baseline 1
font_size 9.8
disable_ligatures cursor

# Cursor
cursor_shape beam
cursor_beam_thickness 1
cursor_blink_interval 0.6
cursor_trail 200
cursor_trail_start_threshold 1

# Scrollback
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 4096

# Mouse
touch_scroll_multiplier 6
url_style single
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
copy_on_select yes

# Window
map f11 toggle_fullscreen
enable_audio_bell no
window_alert_on_bell no
bell_on_tab no
enabled_layouts splits
window_border_width 2px
draw_minimal_borders no
window_margin_width 0
window_padding_width 5
inactive_text_alpha 0.85
hide_window_decorations yes

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
active_tab_font_style bold
inactive_tab_font_style normal

linux_display_server wayland

background_opacity 0.98

# Keyboard shortcuts
kitty_mod ctrl+shift
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map kitty_mod+up        no_op
map kitty_mod+down      no_op
map ctrl+page_up scroll_page_up
map ctrl+page_down scroll_page_down
map ctrl+home scroll_home
map ctrl+end scroll_end
map kitty_mod+n>i  launch --cwd=current --location=vsplit
map kitty_mod+n>e  launch --cwd=current --location=hsplit
map kitty_mod+n>w    new_os_window_with_cwd
map kitty_mod+right no_op
map kitty_mod+left no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
map ctrl+alt+tab no_op
map ctrl+alt+shift+tab no_op
# map kitty_mod+t new_tab_with_cwd
map kitty_mod+backspace change_font_size all 0
map kitty_mod+f>kitty_mod+f kitten hints --type path --hints-foreground-color black --hints-background-color gray --hints-text-color yellow --program -
map kitty_mod+f>kitty_mod+c kitten hints --type path --hints-foreground-color black --hints-background-color gray --hints-text-color yellow --program @
map ctrl+m>ctrl+m toggle_marker regex 1 "^❯\s{1}.+$"
map ctrl+m>ctrl+p scroll_to_mark prev
map ctrl+m>ctrl+n scroll_to_mark next

# Media-control glyphs (Claude Code mode indicator); the default fallback
# picks Noto Color Emoji / Font Awesome and draws them wide
symbol_map U+23E9-U+23FA Noto Sans Symbols 2

# Dingbats that JetBrains Mono lacks; without this, kitty falls back to
# Noto Color Emoji and draws e.g. U+2714 as a colour emoji. Emoji-only
# dingbats (U+2705, U+274C, U+2728, ...) are left to the emoji font.
symbol_map U+2700-U+2704,U+2706-U+2709,U+270B-U+2712,U+2714,U+2716,U+2718-U+271C,U+2722-U+2727,U+2729-U+2735,U+2737-U+274B,U+274D,U+274F-U+2753,U+2756-U+276D,U+2772-U+2775,U+2798-U+279B,U+279F-U+27AF,U+27B1-U+27BE Noto Sans Symbols 2
symbol_map U+271D-U+2721,U+2776-U+2793 Noto Sans Symbols

# Nerd Font symbol ranges
symbol_map U+23FB-U+23FE,U+2B58 Symbols Nerd Font Mono
symbol_map U+2665,U+26A1,U+F400-U+F533 Symbols Nerd Font Mono
symbol_map U+E000-U+E00A Symbols Nerd Font Mono
symbol_map U+E0A0-U+E0A2,U+E0A3,U+E0B0-U+E0B3,U+E0B4-U+E0C8,U+E0CA,U+E0CC-U+E0D7 Symbols Nerd Font Mono
symbol_map U+E200-U+E2A9,U+ED00-U+EFC1,U+F000-U+F2FF Symbols Nerd Font Mono
symbol_map U+E300-U+E3E3 Symbols Nerd Font Mono
symbol_map U+E5FA-U+E6B5 Symbols Nerd Font Mono
symbol_map U+E700-U+E7C5 Symbols Nerd Font Mono
symbol_map U+EA60-U+EC1E Symbols Nerd Font Mono
symbol_map U+F300-U+F375 Symbols Nerd Font Mono
symbol_map U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Force Noto Color Emoji; Font Awesome/DejaVu also claim these codepoints,
# causing wrong/monochrome fallbacks. Excludes BMP ranges already claimed
# above for Nerd Font prompt icons.
symbol_map U+1F000-U+1F2FF,U+1F300-U+1FAFF,U+FE0F Noto Color Emoji

# >>> herdr-radar font block
symbol_map U+E1A0-U+E1BA Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max
# <<< herdr-radar font block
