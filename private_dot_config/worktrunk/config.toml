# Close the herdr workspace of a removed worktree. wt does not know about herdr.
[post-remove]
herdr = '''
command -v herdr >/dev/null || exit 0
herdr workspace list 2>/dev/null \
  | jq -r --arg p "{{ worktree_path }}" \
      '.result.workspaces[] | select(.worktree.checkout_path == $p) | .workspace_id' \
  | while read -r id; do herdr workspace close "$id" >/dev/null; done
exit 0
'''
